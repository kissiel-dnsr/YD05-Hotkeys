<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YD05 Hotkeys & Scripts</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<header class="header">

    <div class="header-top">

        <div>
            <h1>📖 YD05 Hotkeys & Scripts</h1>
            <p id="scriptCounter">0 of 0 scripts shown</p>
        </div>

        <button id="addScriptBtn">
            ➕ Add New Script
        </button>

    </div>

    <div class="search-area">

        <input
            type="text"
            id="searchInput"
            placeholder="Search hotkey, script text, or category..."
        >

    </div>

    <div class="categoryBar" id="categoryBar">

        <button class="category active" data-category="All">
            📋 All Categories
        </button>

        <button class="category" data-category="General">
            📄 General
        </button>

        <button class="category" data-category="Deposit">
            💰 Deposit
        </button>

        <button class="category" data-category="Withdrawal">
            💸 Withdrawal
        </button>

        <button class="category" data-category="Bank">
            🏦 Bank
        </button>

        <button class="category" data-category="Account">
            👤 Account
        </button>

        <button class="category" data-category="Bonus">
            🎁 Bonus
        </button>

        <button class="category" data-category="Game">
            🎮 Game
        </button>

        <button class="category" data-category="Third Party">
            💳 Third Party
        </button>

    </div>

</header>

<main>

    <div id="scriptContainer">

        <!-- Loaded by JavaScript -->

    </div>

</main>

<button id="scrollTop">
⬆
</button>

<script src="script.js"></script>

</body>
</html>
